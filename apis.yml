apis:
- aid: fyno:user-profiles
  name: Fyno User Profiles API
  description: >
    REST API for creating, reading, updating, and deleting user profiles within the Fyno platform. Supports
    adding and updating channel-specific destination data, merging user profiles, and managing channel
    identifiers for targeted notification delivery.
  humanURL: https://fyno.io/docs/home
  baseURL: https://api.fyno.io/v1
  tags:
  - Users
  - Profiles
  - Identity
  properties:
  - type: Documentation
    url: https://fyno.io/docs/home
- aid: fyno:user-subscriptions
  name: Fyno User Subscriptions API
  description: >
    REST API for managing user notification preferences and subscription settings. Allows retrieval and
    updates of per-user channel preferences and opt-in/opt-out controls for notification categories.
  humanURL: https://fyno.io/docs/home
  baseURL: https://api.fyno.io/v1
  tags:
  - Subscriptions
  - Preferences
  - Users
  properties:
  - type: Documentation
    url: https://fyno.io/docs/home
- aid: fyno:suppression-list
  name: Fyno Suppression List API
  description: >
    REST API for managing the global suppression list to prevent unwanted notifications from being sent
    to specific users. Supports fetching the list, adding users to suppression, and removing suppressed
    users with per-event override capabilities.
  humanURL: https://fyno.io/docs/home
  baseURL: https://api.fyno.io/v1
  tags:
  - Suppression
  - Compliance
  - Users
  properties:
  - type: Documentation
    url: https://fyno.io/docs/home
- aid: fyno:verify
  name: Fyno Verify API
  description: >
    OTP and TOTP-based verification API for authenticating users via SMS, email, or authenticator apps.
    Bundled with Growth and above plans at no additional cost. Supports mobile SDKs for iOS (Swift) and
    Android (Kotlin) as well as React Native.
  humanURL: https://fyno.io/docs/home
  baseURL: https://api.fyno.io/v1
  tags:
  - OTP
  - Authentication
  - Verification
  - TOTP
  properties:
  - type: Documentation
    url: https://fyno.io/docs/home
